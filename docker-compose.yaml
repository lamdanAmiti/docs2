services:
  # ─── Velr Docs (Next.js) — docs.velr.app ─────────────────────────────────
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docs-velr
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SESSION_SECRET=${SESSION_SECRET}
      - NEXT_PUBLIC_APP_URL=https://docs.velr.app
      # Same-origin path: editor served from docs.velr.app/{cool,browser,...}.
      # docsapi.velr.app is kept only for the admin console.
      - NEXT_PUBLIC_COLLABORA_URL=https://docs.velr.app
      # Used by the thumbnail pipeline (server-side POST to convert-to/png).
      # Internal docker hostname; never exposed to the browser.
      - COLLABORA_INTERNAL_URL=http://collabora:9980
    # Fonts are bundled in the Docker image via public/fonts/* — Next.js
    # serves them at /fonts/hebrew/* and /fonts/english/*.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs.rule=Host(`docs.velr.app`)"
      - "traefik.http.routers.docs.entrypoints=https"
      - "traefik.http.routers.docs.tls=true"
      - "traefik.http.routers.docs.tls.certresolver=letsencrypt"
      - "traefik.http.services.docs.loadbalancer.server.port=3000"
      - "traefik.docker.network=coolify"
    networks:
      - coolify
      - supabase

  # ─── Collabora Online (rebranded "Velr Docs" backend) — docsapi.velr.app ─
  collabora:
    build:
      context: .
      dockerfile: Dockerfile.collabora
    container_name: docsapi-collabora
    restart: unless-stopped
    cap_add:
      - MKNOD
    environment:
      # Same-origin setup: Collabora's WOPI calls and iframe content are
      # served through docs.velr.app/{cool,browser,hosting,...} so the
      # browser treats parent + iframe as same origin (fixes Chrome's
      # clipboard partitioning).
      #
      # NOTE: aliasgroup1 env var is intentionally OMITTED. It produces a
      # full-URL regex that fails to match incoming WOPISrc which lacks
      # explicit :443. Dockerfile.collabora pre-configures alias_groups
      # in coolwsd.xml with a hostname-only regex instead.
      - server_name=docs.velr.app
      - username=${COLLABORA_ADMIN_USER}
      - password=${COLLABORA_ADMIN_PASSWORD}
      - dictionaries=en_US
      # user_interface.mode=compact gives us the classic menubar + slim
      # toolbar (no ribbon), which is much closer to Tiptap / Google Docs.
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:welcome.enable=false --o:net.proto=IPv4 --o:user_interface.mode=compact
      - DONT_GEN_SSL_CERT=1
    # Fonts are baked into the image via Dockerfile.collabora (both
    # /usr/share/fonts/truetype/ AND /opt/cool/systemplate/ so the chroot
    # jails see them) — no runtime bind-mount needed.
    labels:
      - "traefik.enable=true"
      # --- Same-origin routes on docs.velr.app (what the editor uses) ---
      # Higher priority than the catch-all Next.js route so these path
      # prefixes go to Collabora instead of the app.
      - "traefik.http.routers.collabora-same-origin.rule=Host(`docs.velr.app`) && (PathPrefix(`/cool`) || PathPrefix(`/browser`) || PathPrefix(`/hosting`) || PathPrefix(`/lool`))"
      - "traefik.http.routers.collabora-same-origin.entrypoints=https"
      - "traefik.http.routers.collabora-same-origin.tls=true"
      - "traefik.http.routers.collabora-same-origin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.collabora-same-origin.priority=100"
      - "traefik.http.routers.collabora-same-origin.service=collabora-svc"
      # --- Legacy docsapi.velr.app — kept for the admin console only ---
      - "traefik.http.routers.docsapi.rule=Host(`docsapi.velr.app`)"
      - "traefik.http.routers.docsapi.entrypoints=https"
      - "traefik.http.routers.docsapi.tls=true"
      - "traefik.http.routers.docsapi.tls.certresolver=letsencrypt"
      - "traefik.http.routers.docsapi.service=collabora-svc"
      # Service definition (both routers share it)
      - "traefik.http.services.collabora-svc.loadbalancer.server.port=9980"
      - "traefik.docker.network=coolify"
    networks:
      - coolify

networks:
  coolify:
    external: true
  # Supabase's docker network — lets the Next.js container reach supabase-kong directly
  # if you want to bypass the public hostname. Optional.
  supabase:
    external: true
    name: n08wow4o0gs8kocc4cw8k4g0
